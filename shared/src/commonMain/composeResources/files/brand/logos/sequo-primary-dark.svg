<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320">
  <defs>
    <filter id="brand-green" color-interpolation-filters="sRGB">
      <feFlood flood-color="#16A36A"/>
      <feComposite in2="SourceAlpha" operator="in"/>
    </filter>
    <style>
      .word { font: 850 104px -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; fill: #F5FFF9; letter-spacing: 0; }
      .sub { font: 650 34px -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; fill: #B9CAC1; letter-spacing: 0; }
    </style>
  </defs>
  <rect width="900" height="320" rx="40" fill="#0E1813"/>
  <image href="assets/sequo-shopping-icon.png" x="-20" y="20" width="330" height="264" filter="url(#brand-green)"/>
  <text x="280" y="150" class="word">Sequo</text>
  <text x="286" y="202" class="sub">local shopping</text>
</svg>
